<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý Category (AJAX + RESTful API)</title>
<!-- Bootstrap 5 CSS & FontAwesome Icons -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">

	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
		<div class="container">
			<a class="navbar-brand fw-bold text-warning" href="#">ADMIN AJAX
				PORTAL</a>
			<div class="navbar-nav">
				<a class="nav-link active fw-bold" href="/category-ajax">Quản lý
					Category (AJAX)</a> <a class="nav-link" href="/product-ajax">Quản
					lý Product (AJAX)</a> <a class="nav-link text-info"
					href="/swagger-ui/index.html" target="_blank">Xem Swagger 3 UI</a>
			</div>
		</div>
	</nav>

	<div class="container">
		<div class="card shadow-sm">
			<div
				class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
				<h5 class="mb-0">
					<i class="fa fa-tags me-2"></i> Danh Sách Category (Load bằng AJAX)
				</h5>
				<button class="btn btn-warning btn-sm fw-bold"
					onclick="showCreateCategoryModal()">
					<i class="fa fa-plus-circle me-1"></i> Thêm Category AJAX
				</button>
			</div>
			<div class="card-body">
				<table class="table table-bordered table-hover align-middle"
					id="categoryTable">
					<thead class="table-dark">
						<tr>
							<th style="width: 80px;">ID</th>
							<th style="width: 120px;">Icon</th>
							<th>Tên Category</th>
							<th style="width: 160px;" class="text-center">Thao tác</th>
						</tr>
					</thead>
					<tbody>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<div class="modal fade" id="createCategoryModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="formAddCategory" enctype="multipart/form-data">
					<div class="modal-header bg-primary text-white">
						<h5 class="modal-title">Thêm Mới Category</h5>
						<button type="button" class="btn-close btn-close-white"
							data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<div class="mb-3">
							<label class="form-label fw-bold">Tên Category <span
								class="text-danger">*</span></label> <input type="text"
								class="form-control" name="categoryName" required
								placeholder="Nhập tên category...">
						</div>
						<div class="mb-3">
							<label class="form-label fw-bold">Icon (Hình ảnh)</label> <input
								type="file" class="form-control" name="icon" accept="image/*">
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">Đóng</button>
						<button type="submit" class="btn btn-success">Lưu
							Category</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<div class="modal fade" id="updateCategoryModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="formUpdateCategory" enctype="multipart/form-data">
					<div class="modal-header bg-warning text-dark">
						<h5 class="modal-title fw-bold">Cập Nhật Category</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<input type="hidden" id="edit_categoryId" name="categoryId">
						<div class="mb-3">
							<label class="form-label fw-bold">ID:</label> <input type="text"
								class="form-control bg-light" id="display_categoryId" readonly>
						</div>
						<div class="mb-3">
							<label class="form-label fw-bold">Tên Category <span
								class="text-danger">*</span></label> <input type="text"
								class="form-control" id="edit_categoryName" name="categoryName"
								required>
						</div>
						<div class="mb-3">
							<label class="form-label fw-bold">Đổi Icon mới (Nếu có):</label>
							<input type="file" class="form-control" name="icon"
								accept="image/*">
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">Đóng</button>
						<button type="submit" class="btn btn-primary">Cập nhật</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Bootstrap 5 JS Bundle -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<script>
		// Tải danh sách Category bằng AJAX 
		function loadCategories() {
			$
					.getJSON(
							'/api/category',
							function(response) {
								var tbody = $('#categoryTable tbody');
								tbody.empty(); // Xóa các dòng cũ

								if (response.status && response.body.length > 0) {
									var list = response.body;
									for (var i = 0; i < list.length; i++) {
										var cat = list[i];
										var iconHtml = cat.icon ? '<img src="/admin/categories/images/' + cat.icon + '" style="width:50px; height:50px; object-fit:cover; border-radius:6px;">'
												: '<span class="badge bg-secondary">No Icon</span>';

										var row = '<tr>'
												+ '<td><strong>'
												+ cat.categoryId
												+ '</strong></td>'
												+ '<td>'
												+ iconHtml
												+ '</td>'
												+ '<td class="fw-bold">'
												+ cat.categoryName
												+ '</td>'
												+ '<td class="text-center">'
												+ '<button class="btn btn-sm btn-outline-warning me-1" onclick="showEditCategory('
												+ cat.categoryId
												+ ', \''
												+ cat.categoryName
												+ '\')"><i class="fa fa-edit"></i> Sửa</button>'
												+ '<button class="btn btn-sm btn-outline-danger" onclick="deleteCategory('
												+ cat.categoryId
												+ ')"><i class="fa fa-trash"></i> Xóa</button>'
												+ '</td>' + '</tr>';
										tbody.append(row);
									}
								} else {
									tbody
											.append('<tr><td colspan="4" class="text-center text-muted py-3">Chưa có danh mục nào</td></tr>');
								}
							});
		}

		// Tự động gọi khi load trang
		$(document).ready(function() {
			loadCategories();
		});

		// Mở Modal Thêm mới (Slide 8)
		function showCreateCategoryModal() {
			$('#formAddCategory')[0].reset();
			new bootstrap.Modal($('#createCategoryModal')).show();
		}

		// Xử lý Thêm mới bằng AJAX POST 
		$('#formAddCategory')
				.submit(
						function(e) {
							e.preventDefault();
							var formData = new FormData(this);

							$
									.ajax({
										url : '/api/category/addCategory',
										type : 'POST',
										data : formData,
										contentType : false,
										processData : false,
										success : function(res) {
											bootstrap.Modal.getInstance(
													$('#createCategoryModal'))
													.hide();
											loadCategories(); // Tải lại danh sách ngay lập tức không reload web!
										},
										error : function(err) {
											alert("Lỗi thêm danh mục: "
													+ (err.responseJSON ? err.responseJSON.message
															: "Thất bại"));
										}
									});
						});

		// Mở Modal Sửa
		function showEditCategory(id, name) {
			$('#edit_categoryId').val(id);
			$('#display_categoryId').val(id);
			$('#edit_categoryName').val(name);
			new bootstrap.Modal($('#updateCategoryModal')).show();
		}

		// Xử lý Cập nhật bằng AJAX PUT
		$('#formUpdateCategory').submit(
				function(e) {
					e.preventDefault();
					var formData = new FormData(this);

					$.ajax({
						url : '/api/category/updateCategory',
						type : 'PUT',
						data : formData,
						contentType : false,
						processData : false,
						success : function(res) {
							bootstrap.Modal.getInstance(
									$('#updateCategoryModal')).hide();
							loadCategories(); // Tải lại dữ liệu ngay
						},
						error : function(err) {
							alert("Lỗi cập nhật danh mục!");
						}
					});
				});

		// Xử lý Xóa bằng AJAX DELETE
		function deleteCategory(id) {
			if (confirm("Bạn có chắc chắn muốn xóa Category ID: " + id + "?")) {
				$.ajax({
					url : '/api/category/deleteCategory?categoryId=' + id,
					type : 'DELETE',
					success : function(res) {
						loadCategories(); // Cập nhật lại bảng
					},
					error : function(err) {
						alert("Không thể xóa danh mục này!");
					}
				});
			}
		}
	</script>
</body>
</html>
